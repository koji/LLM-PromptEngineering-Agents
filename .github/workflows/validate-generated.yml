name: Validate generated pages

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "docs/categories/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check category pages are in sync with data/entries.yml
        run: python3 scripts/generate.py --check
